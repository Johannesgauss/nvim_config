# ==============================================================================
# NEOVIM OPTIONAL FEATURES CONFIGURATION (features.conf)
# ==============================================================================
# Simple Linux-style configuration file to toggle optional authoring modules.
# Set any feature to 'false' to completely disable its plugins, commands,
# autocmds, and keybindings (zero bloat).
# ==============================================================================

markdown = true    # Markdown inline rendering (render-markdown) & reader mode
latex    = true    # LaTeX suite (VimTeX) & 2D math formula previews (Nabla)
docx     = true    # Native .docx TUI viewer/editor integration (docxtui)
