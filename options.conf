# ==============================================================================
# NEOVIM OPTIONS CONFIGURATION (options.conf)
# ==============================================================================
# Simple Linux-style configuration file (NO JSON, NO LUA SYNTAX!).
# Controls indentation, search, undo, terminal behavior, and latency tuning.
# ==============================================================================

# Indentation
tabstop          = 8      # Visual width of a tab character
shiftwidth       = 8      # Width of an indent step
expandtab        = false  # false = hard tabs (classic C/kernel), true = spaces
smartindent      = true   # Auto-indent new lines

# Search & Undo
undofile         = true   # Persist undo history across restarts
ignorecase       = true   # Case-insensitive search by default
smartcase        = true   # Case-sensitive search when query contains uppercase

# Terminal Behavior
term_auto_insert = true   # Enter insert mode automatically in terminal buffers
term_auto_close  = true   # Automatically bdelete! terminal buffer on process exit

# Input & Redraw Tuning
timeoutlen       = 250    # Mapped key sequence timeout (ms)
ttimeoutlen      = 5      # Terminal key code timeout (ms)
updatetime       = 150    # CursorHold / swap write delay (ms)
synmaxcol        = 300    # Max columns for legacy regex syntax highlighting
redrawtime       = 1500   # Max time spent redrawing syntax (ms)

# LSP Logging
lsp_log_level    = error  # off | error | warn | info | debug | trace
