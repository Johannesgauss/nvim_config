# ==============================================================================
# NEOVIM SHORTCUTS CONFIGURATION (shortcuts.conf)
# ==============================================================================
# Simple Linux-style configuration file (NO JSON, NO LUA SYNTAX!).
#
# Syntax:
#   key = action                 (Normal mode by default)
#   [mode] key = action          (Specify mode: [i]nsert, [t]erminal, [v]isual)
#   key = action # description   (Optional inline description)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Navigation & Window Splits
# ------------------------------------------------------------------------------
<C-h>      = <C-w>h                          # Mover para a janela da esquerda
<C-l>      = <C-w>l                          # Mover para a janela da direita
<C-j>      = terminal:toggle                 # Alternar terminal inferior

# ------------------------------------------------------------------------------
# 2. File Explorer & Lazygit
# ------------------------------------------------------------------------------
<leader>n  = :NvimTreeToggle<CR>             # Alternar arvore de arquivos
<leader>gg = lazygit:open                    # Abrir Lazygit em tela cheia

# ------------------------------------------------------------------------------
# 3. Fuzzy Search (Telescope)
# ------------------------------------------------------------------------------
<leader>ff = :Telescope find_files<CR>       # Buscar arquivos por nome
<leader>f  = :Telescope find_files<CR>       # Buscar arquivos por nome
<leader>F  = :Telescope live_grep<CR>        # Buscar texto no projeto
<leader>fs = :Telescope grep_string<CR>      # Buscar palavra sob o cursor
<leader>fb = :Telescope buffers<CR>          # Listar buffers abertos
<leader>fh = :Telescope help_tags<CR>        # Buscar documentacao e ajuda

# ------------------------------------------------------------------------------
# 4. Git Diffview
# ------------------------------------------------------------------------------
<leader>gd = :DiffviewOpen<CR>               # Abrir visualizador de diff Git
<leader>gc = :DiffviewClose<CR>              # Fechar visualizador de diff Git
<leader>gh = :DiffviewFileHistory %<CR>      # Historico Git do arquivo atual

# ------------------------------------------------------------------------------
# 5. Markdown & LaTeX
# ------------------------------------------------------------------------------
<leader>mv = markdown:toggle_view            # Alternar Modo Leitor de Markdown
<leader>mr = markdown:toggle_render          # Alternar renderizacao inline de Markdown
<leader>lp = latex:popup                     # LaTeX: Exibir formula em popup 2D
<leader>mp = latex:popup                     # Markdown: Exibir formula em popup 2D
<leader>lv = latex:toggle_virt               # LaTeX: Alternar formulas 2D no buffer

# ------------------------------------------------------------------------------
# 6. Appearance & Retro Modes
# ------------------------------------------------------------------------------
<leader>tt = :ToggleTTY<CR>                  # Alternar modo TTY classico (Linux console)
<leader>tv = :ToggleVimLook<CR>              # Alternar visual Vim classico

# ------------------------------------------------------------------------------
# 7. LSP Diagnostics & Quick Docs
# ------------------------------------------------------------------------------
ge         = lsp:diagnostic_float            # Exibir erro/diagnostico em float
<C-k>      = lsp:hover_doc                   # Exibir documentacao / ajuda

# ------------------------------------------------------------------------------
# 8. AI Assistants
# ------------------------------------------------------------------------------
<leader>ai = ai:antigravity_toggle           # Alternar painel do Google Antigravity
<leader>ad = ai:antigravity_diffview         # Alternar Diffview do Antigravity
<leader>ci = ai:claude_toggle                # Alternar painel do Claude Code
<leader>cc = ai:copilot_chat                 # Alternar Copilot Chat
<leader>cr = ai:copilot_reset                # Reiniciar Copilot Chat
<leader>os = ai:ollama_model_swap            # Alternar modelo local do Ollama

# ------------------------------------------------------------------------------
# 9. Insert Mode Shortcuts
# ------------------------------------------------------------------------------
[i] jk     = <Esc>                           # Sair do modo de insercao
[i] <C-y>  = ai:ollama_complete              # Disparar autocompletar local do Ollama

# ------------------------------------------------------------------------------
# 10. Terminal Mode Shortcuts
# ------------------------------------------------------------------------------
[t] jk     = <C-\><C-n>                      # Sair do modo terminal
[t] <C-h>  = <C-\><C-n><C-w>h                # Sair do terminal para a esquerda
[t] <C-l>  = <C-\><C-n><C-w>l                # Sair do terminal para a direita
[t] <C-k>  = <C-\><C-n><C-w>k                # Sair do terminal para cima
[t] <C-j>  = terminal:toggle                 # Fechar/alternar terminal

# ------------------------------------------------------------------------------
# 11. Visual Mode Shortcuts
# ------------------------------------------------------------------------------
[v] <leader>cc = ai:copilot_chat             # Enviar selecao para Copilot Chat
