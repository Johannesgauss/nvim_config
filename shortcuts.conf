# ==============================================================================
# NEOVIM SHORTCUTS CONFIGURATION (shortcuts.conf)
# ==============================================================================
# Simple Linux-style configuration file (NO JSON, NO LUA SYNTAX!).
#
# Syntax:
#   key = action                 (Normal mode by default)
#   [mode] key = action          (Specify mode: [i]nsert, [t]erminal, [v]isual)
#   key = action # description   (Optional inline description)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Navigation & Window Splits
# ------------------------------------------------------------------------------
<C-h>      = <C-w>h                          # Move to window on the left
<C-l>      = <C-w>l                          # Move to window on the right
<C-j>      = terminal:toggle                 # Toggle bottom terminal

# ------------------------------------------------------------------------------
# 2. File Explorer & Lazygit
# ------------------------------------------------------------------------------
<leader>n  = :NvimTreeToggle<CR>             # Toggle file tree explorer
<leader>gg = lazygit:open                    # Open Lazygit fullscreen

# ------------------------------------------------------------------------------
# 3. Fuzzy Search (Telescope)
# ------------------------------------------------------------------------------
<leader>ff = :Telescope find_files<CR>       # Find files by name
<leader>f  = :Telescope find_files<CR>       # Find files by name
<leader>F  = :Telescope live_grep<CR>        # Search text across project
<leader>fs = :Telescope grep_string<CR>      # Search word under cursor
<leader>fb = :Telescope buffers<CR>          # List open buffers
<leader>fh = :Telescope help_tags<CR>        # Search documentation and help tags

# ------------------------------------------------------------------------------
# 4. Git Diffview
# ------------------------------------------------------------------------------
<leader>gd = :DiffviewOpen<CR>               # Open Git diff viewer
<leader>gc = :DiffviewClose<CR>              # Close Git diff viewer
<leader>gh = :DiffviewFileHistory %<CR>      # Git file history of current buffer

# ------------------------------------------------------------------------------
# 5. Markdown & LaTeX
# ------------------------------------------------------------------------------
<leader>mv = markdown:toggle_view            # Toggle Markdown distraction-free reader mode
<leader>mr = markdown:toggle_render          # Toggle inline visual Markdown rendering
<leader>lp = latex:popup                     # LaTeX: Display formula popup in 2D
<leader>mp = latex:popup                     # Markdown: Display formula popup in 2D
<leader>lv = latex:toggle_virt               # LaTeX: Toggle 2D virtual line formulas

# ------------------------------------------------------------------------------
# 6. Appearance & Retro Modes
# ------------------------------------------------------------------------------
<leader>tt = :ToggleTTY<CR>                  # Toggle classic TTY mode (Linux console)
<leader>tv = :ToggleVimLook<CR>              # Toggle classic Vim look

# ------------------------------------------------------------------------------
# 7. LSP Diagnostics & Quick Docs
# ------------------------------------------------------------------------------
ge         = lsp:diagnostic_float            # Open diagnostic float
<C-k>      = lsp:hover_doc                   # Show hover documentation / class details

# ------------------------------------------------------------------------------
# 8. AI Assistants
# ------------------------------------------------------------------------------
<leader>ai = ai:antigravity_toggle           # Toggle Google Antigravity panel
<leader>ad = ai:antigravity_diffview         # Toggle Antigravity Diffview
<leader>ci = ai:claude_toggle                # Toggle Claude Code panel
<leader>cc = ai:copilot_chat                 # Toggle Copilot Chat
<leader>cr = ai:copilot_reset                # Reset Copilot Chat
<leader>os = ai:ollama_model_swap            # Switch local Ollama model

# ------------------------------------------------------------------------------
# 9. GDB Quick Debug
# ------------------------------------------------------------------------------
<leader>db = gdb:debug                       # Auto-compile (-g -O0) and launch GDB in terminal

# ------------------------------------------------------------------------------
# 10. Insert Mode Shortcuts
# ------------------------------------------------------------------------------
[i] jk     = <Esc>                           # Exit insert mode
[i] <C-y>  = ai:ollama_complete              # Trigger local Ollama autocomplete

# ------------------------------------------------------------------------------
# 11. Terminal Mode Shortcuts
# ------------------------------------------------------------------------------
[t] jk     = <C-\><C-n>                      # Exit terminal mode
[t] <C-h>  = <C-\><C-n><C-w>h                # Navigate from terminal to left window
[t] <C-l>  = <C-\><C-n><C-w>l                # Navigate from terminal to right window
[t] <C-k>  = <C-\><C-n><C-w>k                # Navigate from terminal to upper window
[t] <C-j>  = terminal:toggle                 # Toggle/close bottom terminal

# ------------------------------------------------------------------------------
# 12. Visual Mode Shortcuts
# ------------------------------------------------------------------------------
[v] <leader>cc = ai:copilot_chat             # Send selection to Copilot Chat
